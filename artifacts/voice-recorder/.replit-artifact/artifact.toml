kind = "mobile"
previewPath = "/"
title = "Voice Recorder"
description = "A private Android voice recorder that records only after the user starts it, shows a persistent recording indicator, continues with the screen off where Android allows, and provides a clear stop control and local recordings list."
version = "1.0.0"
id = "artifacts/voice-recorder"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23313

[services.development]
run = "pnpm --filter @workspace/voice-recorder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voice-recorder", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/voice-recorder", "run", "serve" ]

[services.env]
PORT = "23313"
BASE_PATH = "/"
